<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillSprout Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 w-full max-w-sm rounded-2xl shadow-lg border border-emerald-100">
    <h1 class="text-2xl font-extrabold text-emerald-700 text-center">🌱 SkillSprout</h1>
    <h2 id="formHeading" class="text-center font-bold text-slate-800 mt-2">Welcome Back</h2>
    <p class="text-center text-xs text-slate-500 mt-1">Sign in to persist your roadmap in SQLite</p>

    <div id="authError" class="hidden mt-3 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700"></div>

    <form id="authForm" class="mt-4 space-y-3">
      <div id="nameWrap" class="hidden">
        <label class="text-xs font-medium text-slate-600" for="displayName">Full Name</label>
        <input type="text" id="displayName" placeholder="Your Name" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600" for="email">Email</label>
        <input type="email" id="email" placeholder="student@example.com" required class="w-full p-2.5 border rounded-lg mt-1 text-sm">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600" for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6" class="w-full p-2.5 border rounded-lg mt-1 text-sm">
      </div>
      <button id="submitBtn" type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-sm">
        Login
      </button>
    </form>

    <div class="mt-4 text-center text-xs text-slate-600 space-y-2">
      <p>
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleModeBtn" type="button" class="text-emerald-700 font-bold hover:underline ml-1">Sign Up</button>
      </p>
      <p>
        <a href="/frontend.html" class="text-slate-500 hover:underline">Continue as Guest →</a>
      </p>
    </div>
  </div>

  <script type="module" src="/public/js/login.js"></script>
</body>
</html>
